version: 2.1

# Setup workflow: see script/ci-promote-gate and promote.yml.
setup: true

orbs:
  circleci-cli: circleci/circleci-cli@0.1.11
  continuation: circleci/continuation@1

commands:
  # The Rakefile parses `circleci` output (ChangelogGate.parse_promoted_version,
  # registry_version) and is pinned to this version. The orb's default,
  # `latest`, is 1.x, which reads CIRCLE_TOKEN, not CIRCLECI_CLI_TOKEN. Bump
  # this with those parsers, and with the copy in promote.yml (a spec checks
  # they match).
  install-cli:
    steps:
      - circleci-cli/install:
          version: v0.1.33494

  authenticated-cli:
    description: Checkout plus a circleci CLI logged in with CIRCLE_API_TOKEN from the job's context.
    steps:
      - checkout
      - install-cli
      - circleci-cli/setup:
          token: CIRCLE_API_TOKEN

jobs:
  test:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - checkout
      - install-cli
      - run:
          name: Install shellcheck
          command: |
            sudo apt-get update
            sudo apt-get install -y shellcheck
      - run:
          name: Install rspec
          command: gem install rspec --no-document
      - run:
          name: Run test suite
          command: rake test

  # Publishes this commit as dev:<sha> (what `promote` ships) and as
  # dev:alpha (for trying the orb from other projects). Promote reads the
  # sha label, so a later merge or a laptop `rake publish` moving dev:alpha
  # can't change what an approval ships.
  publish:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - authenticated-cli
      - run:
          name: Publish dev:<sha>
          command: rake "publish[${CIRCLE_SHA1}]"
      - run:
          name: Publish dev:alpha
          command: rake publish

  gate:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - authenticated-cli
      - run:
          name: Decide whether the commit subject asks for a promote
          command: script/ci-promote-gate
      - run:
          name: Stop unless promoting
          command: |
            if [ ! -f /tmp/promote-params.json ]; then
              circleci-agent step halt
            fi
      - continuation/continue:
          configuration_path: .circleci/promote.yml
          parameters: /tmp/promote-params.json

workflows:
  ci:
    jobs:
      - test
      - publish:
          context: CircleCI
          requires:
            - test
          filters:
            branches:
              only: main
      - gate:
          context: CircleCI
          requires:
            - publish
          filters:
            branches:
              only: main
