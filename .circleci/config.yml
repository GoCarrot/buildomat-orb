version: 2.1

orbs:
  circleci-cli: circleci/circleci-cli@0.1.11

commands:
  # The Rakefile parses `circleci` output (ChangelogGate.parse_promoted_version,
  # registry_version) and is pinned to this version. The orb's default,
  # `latest`, is 1.x, which prints different output and reads CIRCLE_TOKEN
  # instead of CIRCLECI_CLI_TOKEN. Bump this with those parsers.
  install-cli:
    steps:
      - circleci-cli/install:
          version: v0.1.33494

  authenticated-cli:
    description: Checkout plus a circleci CLI logged in with CIRCLECI_CLI_TOKEN from the job's context.
    steps:
      - checkout
      - install-cli
      - circleci-cli/setup

jobs:
  test:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - checkout
      - install-cli
      - run:
          name: Install shellcheck
          command: |
            sudo apt-get update
            sudo apt-get install -y shellcheck
      - run:
          name: Install rspec
          command: gem install rspec --no-document
      - run:
          name: Run test suite
          command: rake test

  # Publishes this commit as dev:<sha> (what `promote` ships) and as
  # dev:alpha (for trying the orb from other projects). Promote reads the
  # sha label, so a later merge or a laptop `rake publish` moving dev:alpha
  # can't change what an approval ships.
  publish:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - authenticated-cli
      - run:
          name: Publish dev:<sha>
          command: rake "publish[${CIRCLE_SHA1}]"
      - run:
          name: Publish dev:alpha
          command: rake publish

  promote:
    docker:
      - image: cimg/ruby:3.3.9
    steps:
      - authenticated-cli
      - run:
          name: Promote if the commit subject asks for a bump
          command: script/ci-promote

workflows:
  ci:
    jobs:
      - test
      - publish:
          # TODO: placeholder; swap for the real context name before merge.
          context: buildomat-orb-publish
          requires:
            - test
          filters:
            branches:
              only: main
      - hold:
          type: approval
          requires:
            - publish
          filters:
            branches:
              only: main
      - promote:
          context: buildomat-orb-publish
          requires:
            - hold
          filters:
            branches:
              only: main
