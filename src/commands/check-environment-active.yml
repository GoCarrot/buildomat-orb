description: >
  Looks up whether the environment behind a workspace is switched on (account
  registry, then <prefix>/config/core/active) and exports ENVIRONMENT_ACTIVE
  (true or false) to later steps in the job. A missing registry entry or
  parameter counts as active; any other lookup error fails the step. Needs the
  AWS cli, jq, and credentials that can read SSM.

parameters:
  workspace:
    type: string
    description: >
      The terraform workspace, or deploy account slug, to check. Can be an env
      var. Empty means active, with no AWS call.

steps:
  - run:
      name: "Check environment activation"
      environment:
        I_WORKSPACE: << parameters.workspace >>
      command: << include(scripts/environment_active.sh) >>
