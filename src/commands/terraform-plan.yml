description: "Run `terraform plan`."

parameters:
  out_plan:
    type: string
    default: "teak-orb-terraform.tfplan"

  out_log:
    type: string
    default: "teak-orb-terraform.plan.log"

  out_path:
    type: string
    default: "/tmp/teak-orb-terraform"

  workspace:
    type: string
    description: Name of the terraform workspace
    default: ""

  path:
    type: "string"
    description: "Path to the terraform module"
    default: "."

  var:
    default: ''
    description: "Comma separated list of vars to set, e.g. 'foo=bar,baz=boo'"
    type: string

  continuation:
    type: boolean
    description: "Prepares a continue_params.json file for use with https://circleci.com/developer/orbs/orb/circleci/continuation."
    default: false

  continuation_parameters:
    default: ''
    description: "Comma separated list of additional parameters to set for the continued pipeline e.g. 'foo=bar,baz=boo'"
    type: string

  var_file:
    default: ''
    description: "Comma separated list of var_files to load to set, e.g. 'dev.tfvars'"
    type: string

  continuation_cache_key:
    type: string
    description: >
      Cache key the planfile is saved under when continuation is true. Repos
      planning several roots in one workflow need a distinct key per root,
      since cache keys are immutable and the first save wins.
    default: "{{ .Environment.CIRCLE_WORKFLOW_ID }}"

  store_plan_artifact:
    type: boolean
    description: >
      Store the planfile as a job artifact. A planfile holds prior state and
      data-source results in plaintext (e.g. decrypted aws_kms_secrets), and
      artifacts are downloadable by anyone with project read. Set false for
      roots that read secrets. The continuation cache still gets the planfile.
    default: true

  lock:
    type: boolean
    description: >
      Whether to take the state lock while planning. Set to false only when
      the plan's output is discarded and nothing will write state from it —
      e.g. an advisory plan on a branch that never continues into an apply —
      since skipping the lock risks reading state mid-write otherwise.
    default: true

steps:
  - when:
      condition:
        and:
          - not: << parameters.lock >>
          - << parameters.continuation >>
      steps:
        - run:
            name: "Validate lock/continuation combination"
            command: |
              echo "lock: false is incompatible with continuation: true — an unlocked plan must never feed an apply." >&2
              exit 1
  - run:
      name: Terraform Plan
      environment:
        I_OUT_PLAN: << parameters.out_plan >>
        I_OUT_LOG: << parameters.out_log >>
        I_OUT_PATH: << parameters.out_path >>
        I_WORKSPACE: << parameters.workspace >>
        I_PATH: << parameters.path >>
        I_VAR: << parameters.var >>
        I_VAR_FILE: << parameters.var_file >>
        I_LOCK: << parameters.lock >>
      command: << include(scripts/terraform_plan.sh) >>
  - when:
      condition: << parameters.continuation >>
      steps:
        - run:
            name: "Generate continue_params"
            environment:
              I_OUT_PATH: << parameters.out_path >>
              I_WORKSPACE: << parameters.workspace >>
              I_OUT_LOG: << parameters.out_log >>
              I_CONTINUATION_PARAMETERS: << parameters.continuation_parameters >>
            command: << include(scripts/terraform_plan_continuation.sh) >>
        - save_cache:
            key: << parameters.continuation_cache_key >>
            paths:
              - << parameters.out_path >>/<< parameters.out_plan >>
  - when:
      condition: << parameters.store_plan_artifact >>
      steps:
        - store_artifacts:
            path: << parameters.out_path >>/<< parameters.out_plan >>
  - store_artifacts:
      path: << parameters.out_path >>/<< parameters.out_log >>
